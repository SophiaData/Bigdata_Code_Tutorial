# Log4j 2 configuration.
#
# This file previously mixed Log4j 2 keys (rootLogger.*, appender.*.type) with Log4j 1.x keys
# (log4j.rootLogger, log4j.appender.stdout), and the 1.x line won because log4j-1.2-api was on the
# classpath. The effective level was therefore ERROR, not the INFO the 2.x block implied. Only the
# Log4j 2 syntax is used now.
#
# The previous FILE appender pointed at ${sys:log.dir}/mvn-${sys:mvn.forkNumber}.log, which are
# Maven Surefire variables that do not exist outside a test run. Use -Dlog.dir=... to redirect.

status = warn

# Root logger: INFO to the console. Raise to `debug` when diagnosing CDC deserialization.
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# -----------------------------------------------------------------------------
# Console appender
# -----------------------------------------------------------------------------
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %-40.40c{1.} - %m%n

# -----------------------------------------------------------------------------
# Optional file appender, enabled only when -Dlog.dir is set.
# -----------------------------------------------------------------------------
appender.file.name = FileAppender
appender.file.type = FILE
appender.file.fileName = ${sys:log.dir:-target/logs}/flink-cdc.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %-40.40c{1.} - %m%n

# -----------------------------------------------------------------------------
# Quiet the noisy third-party loggers so the job's own output stays readable.
# -----------------------------------------------------------------------------
logger.zk.name = org.apache.zookeeper
logger.zk.level = WARN

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

logger.debezium.name = io.debezium
logger.debezium.level = WARN

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
