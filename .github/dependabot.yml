# Dependabot — weekly automated dependency PRs for Maven modules.
# Groups minor/patch updates per ecosystem to keep PR volume manageable.

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    groups:
      # Keep all Flink minor versions together so a single PR tests compatibility.
      apache-flink:
        patterns:
          - "org.apache.flink:*"
          - "org.apache.flink:flink-shaded-*"
        exclude-patterns:
          # CDC connectors use Flink-versioned qualifiers (3.6.0-1.20 vs
          # 3.6.0-2.2) that Dependabot misreads as version progression.
          # They belong to the flink-cdc group below; excluding them from the
          # apache-flink group prevents dual-group PRs that break the default
          # build line.
          - "org.apache.flink:flink-cdc-*"
          - "org.apache.flink:flink-sql-connector-mysql-cdc"
      # CDC connector upgrades are coordinated with Flink group above.
      flink-cdc:
        patterns:
          - "org.apache.flink:flink-cdc-*"
          - "org.apache.flink:flink-sql-connector-mysql-cdc"
          - "com.ververica:*"
      # Test dependencies batched separately — higher churn, lower risk.
      test:
        patterns:
          - "org.junit*:*"
          - "org.testcontainers:*"
          - "org.mockito:*"
          - "io.opentelemetry:*"
      # Jackson core/databind/annotations must move together: they share a
      # dependency tree and the enforcer's requireUpperBoundDeps fails the build
      # when only one of them moves. Batching them keeps the versions aligned.
      jackson:
        patterns:
          - "com.fasterxml.jackson.core:*"
          - "com.fasterxml.jackson.dataformat:*"
          - "com.fasterxml.jackson.datatype:*"
          - "com.fasterxml.jackson.module:*"
      # Generic batch for everything else.
      other-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "org.apache.flink:*"
          - "org.apache.flink:flink-shaded-*"
          - "org.apache.flink:flink-cdc-*"
          - "org.apache.flink:flink-sql-connector-mysql-cdc"
          - "com.ververica:*"
          - "org.junit*:*"
          - "org.testcontainers:*"
          - "org.mockito:*"
          - "io.opentelemetry:*"
          - "com.fasterxml.jackson.core:*"
          - "com.fasterxml.jackson.dataformat:*"
          - "com.fasterxml.jackson.datatype:*"
          - "com.fasterxml.jackson.module:*"
    # Ignore major version bumps for Flink (likely breaking) — bump manually.
    ignore:
      - dependency-name: "org.apache.flink:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.flink:flink-shaded-*"
        update-types: ["version-update:semver-major"]
      # The build runs on JDK 11 (see CLAUDE.md). JUnit 6 is compiled for Java 17
      # (class file version 61 vs the 55 the JDK 11 compiler accepts), so a major
      # bump cannot even be compiled — it fails with "cannot access
      # org.junit.jupiter.api.Test". Nothing below 6 needs newer than Java 11.
      - dependency-name: "org.junit*:*"
        update-types: ["version-update:semver-major"]
      # Same JDK 11 constraint: spotless 3.x is built for Java 17 and fails to
      # load on JDK 11 with ComponentLookupException (SpotlessCheckMojo is class
      # file version 61.0). The 2.x line stays on Java 11.
      - dependency-name: "com.diffplug.spotless:*"
        update-types: ["version-update:semver-major"]
      # Build plugins that are JDK-version sensitive. The versions in use are
      # pinned to the JDK 11 toolchain, so major bumps need a manual decision
      # alongside a JDK upgrade rather than an automatic PR.
      - dependency-name: "org.apache.maven.plugins:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.spotbugs:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jacoco:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.codehaus.mojo:*"
        update-types: ["version-update:semver-major"]
      # CDC connectors use Flink-versioned qualifiers (3.6.0-1.20,
      # 3.6.0-2.2). Dependabot reads "2.2 > 1.20" and proposes a
      # "version bump" that changes which Flink line the connector
      # targets, which breaks the default build. All CDC version
      # changes must be manual.
      - dependency-name: "org.apache.flink:flink-cdc-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "org.apache.flink:flink-sql-connector-mysql-cdc"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # ErrorProne: class-file version must match the build JDK.
      # 2.41.0 is the last for JDK 17 (class file 61); 2.44.0+
      # requires JDK 21 (class file 65). Any bump needs a JDK check.
      - dependency-name: "com.google.errorprone:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Paimon: major bumps (1.x → 2.x) change the storage format
      # and the sink API. Patch bumps within the same major are safe.
      - dependency-name: "org.apache.paimon:*"
        update-types: ["version-update:semver-major"]
      # HikariCP: the connection-pool API changes across major
      # versions. 5.x is the last for the current Flink connector
      # family; 6.x changes the metrics SPI.
      - dependency-name: "com.zaxxer:HikariCP"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"