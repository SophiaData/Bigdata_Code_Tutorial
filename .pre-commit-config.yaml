# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_stages: [commit, push]

repos:
  # This is a Java/Maven repository; the previous configuration installed four Python linters
  # (isort, black, flake8, autoflake) that could never match a file, since the repo contains no
  # .py sources. The generic file hygiene hooks below are language-agnostic and actually apply.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-xml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      # NOTE: `mixed-line-ending` / `line-ending` hooks are deliberately NOT enabled.
      # This repository is developed on Windows with core.autocrlf=true, so a hook that forces LF
      # would rewrite every file and make spotless's sortPom report a whole-file "format violation"
      # on pom.xml (the same trap that a `* text=auto eol=lf` .gitattributes rule falls into).
      # Line endings are left to git's autocrlf setting.

  - repo: local
    hooks:
      # Java formatting. spotless:apply rewrites files in place, matching the previous behaviour.
      # Requires a JDK on PATH.
      - id: spotless
        name: spotless (java formatting)
        entry: ./mvnw spotless:apply
        language: system
        files: '\.java$|pom\.xml$'
        pass_filenames: false
